            overflow: hidden;
            border: 1px solid #ccc;

        }

            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }

            background-color: #ddd;
        }

        /* Create an active/current tablink class */

            background-color: #ccc;
        }

        /* Style the tab content */

            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
