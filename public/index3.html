    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /*
        nav {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 50px;
            padding: 15px;

            background: #263238;
            color: white;
        }
        */
        .nav-header {
            position: sticky;
            top: 0;
            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            padding: 6px 10px;
            background: #e9f1f6;
            box-sizing: border-box;
            width: 100%;
        }

        .nav-left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .nav-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            gap: 4px;
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .nav-info {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /*
        .nav-right button {
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 1.1rem;
            border: 1px solid #bbc8d4;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }
        */
        main {
            width: 100%;
            scroll-margin-top: 50px;
        }

        .welcome {
            min-height: calc(100dvh - 50px);
            padding: 20px;
        }

        .welcome ul {
            max-height: calc((100dvh - 50px) * 0.5);
            overflow-y: auto;
        }

        .app-slider {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }

        .app-page {
            flex: 0 0 100%;
            min-width: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;

            min-height: calc(100dvh - 50px);
            padding: 10px;

            border-bottom: 1px solid #ccc;
            scroll-margin-top: 50px;
        }


        .app-slider.vertical {
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: visible;
            scroll-snap-type: none;
        }

        .app-slider.vertical>.app-page {
            flex: 0 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Horizontale Ebene: Topics */
        #place-container {
            display: block;
            width: 100%;
            height: calc(100dvh - 50px);

            overflow-x: hidden;
            overflow-y: auto;

            scroll-snap-type: y mandatory;
            overscroll-behavior-y: contain;
            /*
            height: calc(100dvh - 50px);
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            */
        }


        /* ein Topic */
        .place-slider {
            display: flex;
            width: 100%;
            height: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;

            /*
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            */
        }

        /* eine location */
        .place-page {
            flex: 0 0 100%;
            min-width: 0;
            height: 100%;
            scroll-snap-align: start;
            scroll-margin-top: 50px;
            /*
            flex: 0 0 100%;
            min-width: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;

            min-height: calc(100dvh - 50px);
            padding: 10px;

            border-bottom: 1px solid #ccc;
            scroll-margin-top: 50px;
            */
        }

        .place-page h2 {
            margin-top: 0;
        }

        .test-content {
            margin-top: 30px;
            padding: 30px;
            background: #e3f2fd;
            border-radius: 8px;
        }

        .place-content {
            width: 100%;
            min-width: 0;
        }

        .myleaflet-map {
            width: 100%;
            height: 50dvh;
            min-height: 250px;
        }

        .mychart {
            width: 100%;
            height: 50dvh;
            min-height: 250px;
        }

        .inline-details {
            display: inline;
        }

        .inline-details summary {
            display: inline;
            color: blue;
            cursor: pointer;
        }

        .inline-details summary::marker {
            content: "";
        }

        .inline-details summary::-webkit-details-marker {
            display: none;
        }

        .inline-details summary::after {
            content: "more";
        }

        .inline-details[open] summary::after {
            content: "less";
        }

        .table-bordered {
            border-collapse: collapse;
            width: 100%;
        }

        .table-bordered th,
        .table-bordered td {
            border: 1px solid #888;
            padding: 4px 6px;
        }

        .table-bordered th {
            background-color: #eee;
        }

        .article-header {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .article-actions {
            display: flex;
            gap: 6px;
        }

        .article-actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .article-menu {
            position: relative;
        }

        .article-menu summary {
            cursor: pointer;
            list-style: none;
            font-size: 24px;
        }

        .article-menu summary::-webkit-details-marker {
            display: none;
        }

        .menu-content {
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 100;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 6px #aaa;
            min-width: 150px;
        }

        .menu-content button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .help-dialog {
            width: min(90vw, 700px);
            max-height: 85dvh;
            box-sizing: border-box;
            overflow-y: auto;
            border: 1px solid #aaa;
            border-radius: 10px;
            padding: 20px;
        }

        .help-dialog::backdrop {
            background: rgb(0 0 0 / 0.4);
        }

        .help-close {
            float: right;
            cursor: pointer;
        }

        .help-content {
            clear: both;
        }

        .help-content p {
            line-height: 1.5;
        }

        .help-content details {
            margin: 0.8em 0;
        }


        .subtitle {
            color: var(--muted);
            margin: 0 auto;
            max-width: 55ch;
            font-size: clamp(.91rem, 1.3vw, 1.04rem)
        }

        .topic-grid {
            /*
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 1.5vw, 18px)
            */
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;

            width: 100%;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;

            align-content: start;
        }

        .topic {
            appearance: none;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            min-width: 0;
            min-height: clamp(150px, 18vh, 205px);
            padding: clamp(15px, 1.8vw, 24px);
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 23px;
            cursor: pointer;
            text-align: left;
            color: #193450;
            background: linear-gradient(145deg, var(--light), var(--deep));
            box-shadow: 0 8px 22px rgba(30, 66, 98, .09);
            overflow: hidden;
            transition: transform .18s, box-shadow .18s
        }

        .topic::after {
            content: "";
            position: absolute;
            pointer-events: none;
            right: -35px;
            top: -55px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .26)
        }

        .topic:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(30, 66, 98, .16)
        }

        .topic:focus-visible {
            outline: 3px solid #145baf;
            outline-offset: 3px
        }

        .topic-icon {
            /*
            display: grid;
            place-items: center;
            width: clamp(45px, 4.7vw, 65px);
            height: clamp(45px, 4.7vw, 65px);
            border-radius: 18px;
            background: rgba(255, 255, 255, .68);
            font-size: clamp(1.65rem, 2.7vw, 2.25rem);
            line-height: 1;
            z-index: 1
            */
            width: 100%;
            height: 100%;
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
        }

        .topic-bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            z-index: 1
        }

        .topic-title {
            font-weight: 760;
            font-size: clamp(.98rem, 1.35vw, 1.24rem);
            line-height: 1.2;
            overflow-wrap: anywhere
        }

        .topic-desc {
            display: block;
            font-weight: 450;
            font-size: .76rem;
            line-height: 1.3;
            margin-top: 5px;
            color: #39556c
        }

        .arrow {
            display: grid;
            place-items: center;
            flex: none;
            width: 31px;
            height: 31px;
            border-radius: 50%;
            background: #ffffffc9;
            font-size: 1.3rem;
            font-weight: 700
        }

        /*
        @media(max-width:1000px) {
            .topic-grid {
                width: "80%",
                    grid-template-columns: repeat(3, minmax(0, 1fr))
            }
        }
        */
        /*
        .topic-grid {
                width: "95%",
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px
            }
        */
        /* Desktop */
        @media (min-width: 1100px) {
            .topic-grid {
                width: 80%;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 20px;
            }
        }

        @media(max-width:650px) {
            main {
                padding: 16px 12px 22px
            }

            header {
                margin-bottom: 18px
            }


            .topic {
                min-height: 148px;
                border-radius: 18px;
                padding: 13px
            }


            .topic-icon {
                /*
                width: 43px;
                height: 43px;
                font-size: 1.65rem;
                border-radius: 13px
                */
                width: 100%;
                height: 100%;
                max-width: 150px;
                max-height: 150px;
                object-fit: contain;
            }

            .topic-title {
                font-size: .97rem
            }

            .topic-desc {
                font-size: .7rem
            }

            .arrow {
                width: 26px;
                height: 26px;
                font-size: 1.1rem
            }

            footer {
                margin-top: 18px
            }
        }

        @media(max-width:350px) {
            .topic-desc {
                display: none
            }

            .topic {
                min-height: 126px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .topic {
                transition: none
            }
        }
    </style>
</head>
