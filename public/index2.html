<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Klima-Mobil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/minibootstrap.css" rel="stylesheet">
    <link href="/node_modules/leaflet/dist/leaflet.css" rel="stylesheet">
    <link type="text/css" href="css/Chart.min.css" />

    <script src="/node_modules/leaflet/dist/leaflet.js" charset="utf-8" crossorigin=""></script>
    <script src="/node_modules/leaflet.control.select/dist/leaflet.control.select.js"></script>
    <script src="lib/chart.min.js"></script>
    <script src="lib/chartjs-plugin-datalabels.js"></script>
    <script src="lib/chartjs-plugin-zoom.js"></script>
    <script src="lib/chartjs-plugin-annotation.min.js"></script>
    <script src="lib/simple-statistics.min.js"></script>
    <script src="lib/js.cookie.min.js"></script>
    <script src="lib/regression.js"></script> <!-- tom alexander -->


    <script src="lib/jquery.min.js"></script>
    <script src="js/kli6900.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 50px;
            padding: 15px;

            background: #263238;
            color: white;
        }

        main {
            width: 100%;
            scroll-margin-top: 50px;
        }

        .welcome {
            min-height: calc(100dvh - 50px);
            padding: 20px;
        }

        .welcome ul {
            max-height: calc((100dvh - 50px) * 0.5);
            overflow-y: auto;
        }

        .app-slider {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }

        .app-page {
            flex: 0 0 100%;
            min-width: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;

            min-height: calc(100dvh - 50px);
            padding: 10px;

            border-bottom: 1px solid #ccc;
            scroll-margin-top: 50px;
        }

        /* Horizontale Ebene: Topics */
        #place-container {
            display: block;
            width: 100%;
            height: calc(100dvh - 50px);

            overflow-x: hidden;
            overflow-y: auto;

            scroll-snap-type: y mandatory;
            overscroll-behavior-y: contain;
            /*
            height: calc(100dvh - 50px);
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            */
        }


        /* ein Topic */
        .place-slider {
            display: flex;
            width: 100%;
            height: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;

            /*
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            */
        }

        /* eine location */
        .place-page {
            flex: 0 0 100%;
            min-width: 0;
            height: 100%;
            scroll-snap-align: start;
            scroll-margin-top: 50px;
            /*
            flex: 0 0 100%;
            min-width: 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;

            min-height: calc(100dvh - 50px);
            padding: 10px;

            border-bottom: 1px solid #ccc;
            scroll-margin-top: 50px;
            */
        }

        .place-page h2 {
            margin-top: 0;
        }

        .test-content {
            margin-top: 30px;
            padding: 30px;
            background: #e3f2fd;
            border-radius: 8px;
        }

        .place-content {
            width: 100%;
            min-width: 0;
        }

        .myleaflet-map {
            width: 100%;
            height: 50dvh;
            min-height: 250px;
        }

        .mychart {
            width: 100%;
            height: 50dvh;
            min-height: 250px;
        }

        .inline-details {
            display: inline;
        }

        .inline-details summary {
            display: inline;
            color: blue;
            cursor: pointer;
        }

        .inline-details summary::marker {
            content: "";
        }

        .inline-details summary::-webkit-details-marker {
            display: none;
        }

        .inline-details summary::after {
            content: "more";
        }

        .inline-details[open] summary::after {
            content: "less";
        }
    </style>
</head>

<body>

    <nav id="navigation" style="display: flex;align-items:center;">
        Klima-Mobil<span id="headertext"></span>
    </nav>

    <main id="application">
        <!--section class="welcome">
            <h1>Welcome</h1>
            <p>Wetterdaten entdecken und vergleichen.</p>
            <button id="selectPlace">Ort auswählen</button>
        </section-->



    </main>

    <main id="place-container" class="statistics">

    </main>
    <script type="module">
        import * as kli2000 from "/modules/kli2000.js";
        kli2000.show();
    </script>

</body>

</html>
