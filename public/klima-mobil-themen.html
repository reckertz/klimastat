<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef5fb">
<title>Klima-Mobil – Themenauswahl</title>
<style>
:root{color-scheme:light;--ink:#17304d;--muted:#536b82;--border:rgba(40,81,113,.12)}
*{box-sizing:border-box}
html{min-height:100%;background:#eaf4fa}
body{margin:0;min-height:100dvh;font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 8% 10%,#d7ecff 0,transparent 43%),radial-gradient(ellipse at 92% 85%,#d8f3e8 0,transparent 42%),linear-gradient(135deg,#f6faff,#eaf4fb 58%,#f4fbf6)}
main{width:min(1300px,100%);margin:auto;padding:clamp(18px,3vw,40px)}
header{text-align:center;margin:0 0 clamp(20px,3vh,36px)}
.eyebrow{display:inline-block;color:#27739a;font-size:.79rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
h1{font-size:clamp(1.6rem,3vw,2.65rem);line-height:1.14;letter-spacing:-.035em;margin:.6rem 0 .65rem}
.subtitle{color:var(--muted);margin:0 auto;max-width:55ch;font-size:clamp(.91rem,1.3vw,1.04rem)}
.topic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.5vw,18px)}
.topic{appearance:none;position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-width:0;min-height:clamp(150px,18vh,205px);padding:clamp(15px,1.8vw,24px);border:1px solid rgba(255,255,255,.75);border-radius:23px;cursor:pointer;text-align:left;color:#193450;background:linear-gradient(145deg,var(--light),var(--deep));box-shadow:0 8px 22px rgba(30,66,98,.09);overflow:hidden;transition:transform .18s,box-shadow .18s}
.topic::after{content:"";position:absolute;pointer-events:none;right:-35px;top:-55px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.26)}
.topic:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(30,66,98,.16)}
.topic:focus-visible{outline:3px solid #145baf;outline-offset:3px}
.topic-icon{display:grid;place-items:center;width:clamp(45px,4.7vw,65px);height:clamp(45px,4.7vw,65px);border-radius:18px;background:rgba(255,255,255,.68);font-size:clamp(1.65rem,2.7vw,2.25rem);line-height:1;z-index:1}
.topic-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;width:100%;z-index:1}
.topic-title{font-weight:760;font-size:clamp(.98rem,1.35vw,1.24rem);line-height:1.2;overflow-wrap:anywhere}
.topic-desc{display:block;font-weight:450;font-size:.76rem;line-height:1.3;margin-top:5px;color:#39556c}
.arrow{display:grid;place-items:center;flex:none;width:31px;height:31px;border-radius:50%;background:#ffffffc9;font-size:1.3rem;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
@media(max-width:1000px){.topic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){main{padding:16px 12px 22px}header{margin-bottom:18px}.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic{min-height:148px;border-radius:18px;padding:13px}.topic-icon{width:43px;height:43px;font-size:1.65rem;border-radius:13px}.topic-title{font-size:.97rem}.topic-desc{font-size:.7rem}.arrow{width:26px;height:26px;font-size:1.1rem}footer{margin-top:18px}}
@media(max-width:350px){.topic-desc{display:none}.topic{min-height:126px}}
@media(prefers-reduced-motion:reduce){.topic{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <span class="eyebrow">Klima-Mobil · Entdecken</span>
  <h1>Mit welchem Thema möchtest Du beginnen?</h1>
  <p class="subtitle">Entdecke Klima und Wetter anhand von Messdaten. Wähle ein Thema – Du kannst jederzeit wechseln.</p>
</header>
<section id="topicGrid" class="topic-grid" aria-label="Klimathemen"></section>
<footer>12 Themen · Ein Klick genügt zum Einstieg</footer>
</main>
<script>
'use strict';
// Beispielthemen: Titel, Icons und IDs an das bestehende topics-Array anpassen.
const exampleTopics = [
  {id:'temperatur', title:'Temperatur', desc:'Wärme und Kälte', icon:'🌡️', colors:['#d9efff','#b7d9f7']},
  {id:'niederschlag', title:'Niederschlag', desc:'Regen und Schnee', icon:'🌧️', colors:['#d8f3ed','#b7e8d7']},
  {id:'sonne', title:'Sonnenschein', desc:'Licht und Strahlung', icon:'☀️', colors:['#fff3cc','#ffe3a1']},
  {id:'wind', title:'Wind', desc:'Richtung und Stärke', icon:'🌬️', colors:['#e4e7ff','#cbd5fb']},
  {id:'extreme', title:'Wetterextreme', desc:'Hitze, Frost, Starkregen', icon:'⛈️', colors:['#ffe0e5','#fac1d0']},
  {id:'jahreszeiten', title:'Jahreszeiten', desc:'Der Wandel im Jahr', icon:'🍂', colors:['#ffead5','#fbd2ab']},
  {id:'stationen', title:'Messstationen', desc:'Daten vor Deiner Haustür', icon:'📍', colors:['#d8ecfc','#b8daf4']},
  {id:'klimawandel', title:'Klimawandel', desc:'Vergleich der Jahrzehnte', icon:'🌍', colors:['#ddf2d6','#bfe4b1']},
  {id:'co2', title:'CO₂', desc:'Messwerte und Tagesgang', icon:'🌿', colors:['#d4f1e7','#a9e2d2']},
  {id:'luftfeuchte', title:'Luftfeuchte', desc:'Wasserdampf in der Luft', icon:'💧', colors:['#d8efff','#b9e0fa']},
  {id:'datenqualitaet', title:'Datenqualität', desc:'Wie zuverlässig sind Daten?', icon:'🔎', colors:['#eee1ff','#d8c6f5']},
  {id:'vergleiche', title:'Orte vergleichen', desc:'Regionen im Überblick', icon:'🗺️', colors:['#d9f4f0','#ade3df']}
];

function renderTopics(topics, onSelect) {
  const grid = document.getElementById('topicGrid');
  grid.replaceChildren();
  for (const topic of topics) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'topic';
    button.style.setProperty('--light', topic.colors?.[0] ?? '#e1efff');
    button.style.setProperty('--deep', topic.colors?.[1] ?? '#bdddf5');
    button.setAttribute('aria-label', `Thema ${topic.title} öffnen`);
    const icon = document.createElement('span');
    icon.className = 'topic-icon';
    icon.setAttribute('aria-hidden','true');
    icon.textContent = topic.icon ?? '🌍';
    const bottom = document.createElement('span');
    bottom.className = 'topic-bottom';
    const info = document.createElement('span');
    const title = document.createElement('span');
    title.className = 'topic-title';
    title.textContent = topic.title;
    info.append(title);
    if (topic.desc) {
      const desc = document.createElement('span');
      desc.className = 'topic-desc';
      desc.textContent = topic.desc;
      info.append(desc);
    }
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.setAttribute('aria-hidden','true');
    arrow.textContent = '→';
    bottom.append(info,arrow);
    button.append(icon,bottom);
    button.addEventListener('click', () => onSelect(topic));
    grid.append(button);
  }
}

function selectTopic(topic) {
  // Integrationspunkt: durch die vorhandene Klima-Mobil-Navigation ersetzen.
  window.dispatchEvent(new CustomEvent('klima:topic-selected', {detail:{topicId:topic.id,topic}}));
  console.log('Gewähltes Thema:', topic.id);
  // Demo-Rückmeldung; im Produkt durch den tatsächlichen Themenwechsel ersetzen.
  document.querySelector('footer').textContent = `Gewählt: ${topic.title}`;
}

renderTopics(exampleTopics, selectTopic);
// Alternativ: renderTopics(existingTopics, selectTopic);
</script>
</body>
</html>
